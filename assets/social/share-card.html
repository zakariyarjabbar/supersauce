<!doctype html>
<html lang="ar-IQ" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>Super Sauce share image</title>
    <style>
      @font-face {
        font-family: Alexandria;
        src: url("{{FONT}}");
        font-weight: 100 900;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        color: #fbf2e1;
        background: #681e32;
        font-family: Alexandria, sans-serif;
      }
      .card {
        position: relative;
        display: grid;
        height: 100%;
        padding: 19px;
        grid-template-columns: 1fr 595px;
        border-bottom: 8px solid #ffc629;
      }
      .copy {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        padding: 16px 38px;
      }
      .logo {
        width: 167px;
        height: auto;
      }
      h1 {
        margin: 31px 0 19px;
        font-size: 64px;
        font-weight: 900;
        letter-spacing: -0.035em;
        line-height: 1.36;
        white-space: nowrap;
      }
      h1 span {
        color: #ffc629;
      }
      .caption {
        margin: 0;
        color: #f6dbc9;
        font-size: 22px;
        font-weight: 500;
        line-height: 1.8;
      }
      .photo {
        min-height: 0;
        overflow: hidden;
        border: 1px solid #cf9758;
        border-radius: 7px;
      }
      .photo img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 58%;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="copy">
        <img class="logo" src="{{LOGO}}" alt="Super Sauce" />
        <h1>طعم غير.<br /><span>طعم سوبر.</span></h1>
        <p class="caption">المنيو، الفروع، وكل شي تحبّه.</p>
      </div>
      <div class="photo"><img src="{{PHOTO}}" alt="برغر سوبر صوص" /></div>
    </main>
  </body>
</html>
